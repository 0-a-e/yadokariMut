# Alembic 設定 (src/ 直下に配置 — エントリポイントは src/ 配下規約に従う)。
# スキーマ変更の正本は src/alembic/versions/ 配下のリビジョン (docs/sqlite-pg-migration-plan.md §3.2)。
# 実行: alembic -c src/alembic.ini upgrade head
#       (または python3 src/cli.py db-init — プログラム実行)
# DSN は src/alembic/env.py が YADOKARIMUT_PG_DSN を解決する(ここには持たない)。
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
